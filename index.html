<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创意博客</title>
    <style>
        /* 全局样式 */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        /* 导航栏 */
        nav {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        nav a {
            color: #fff;
            margin-right: 20px;
            text-decoration: none;
            font-size: 18px;
        }
        nav a:hover {
            color: #00bcd4;
        }

        /* 欢迎区 */
        .hero {
            background: linear-gradient(45deg, #ff8e00, #e52e71);
            color: #fff;
            text-align: center;
            padding: 100px 20px;
        }
        .hero h1 {
            font-size: 3em;
            margin: 0;
        }
        .hero p {
            font-size: 1.5em;
            margin: 10px 0;
        }

        /* 博客内容区 */
        .blog-posts {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .blog-posts h2 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 40px;
        }
        .post {
            background: #fff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .post h3 {
            font-size: 2em;
        }
        .post p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        .read-more {
            text-align: right;
            font-size: 1.1em;
            color: #00bcd4;
            text-decoration: none;
        }
        .read-more:hover {
            text-decoration: underline;
        }

        /* 底部 */
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <a href="#home">首页</a>
        <a href="#blog">博客</a>
        <a href="#contact">联系我</a>
    </nav>

    <!-- 欢迎区 -->
    <div class="hero" id="home">
        <h1>欢迎来到我的创意博客</h1>
        <p>这里分享我对设计、编程、生活的独到见解。</p>
    </div>

    <!-- 博客内容 -->
    <div class="blog-posts" id="blog">
        <h2>最新文章</h2>

        <div class="post">
            <h3>设计与艺术的未来</h3>
            <p>在这篇文章中，我将探讨未来设计与艺术的关系，它们如何融为一体，并影响我们的日常生活。</p>
            <a href="#" class="read-more">阅读全文</a>
        </div>

        <div class="post">
            <h3>编程与创意：一个意想不到的结合</h3>
            <p>编程不仅仅是技术，它也是一种创意的表达方式。在这篇文章中，我将分享我的观点。</p>
            <a href="#" class="read-more">阅读全文</a>
        </div>
    </div>

    <!-- 底部 -->
    <footer id="contact">
        <p>&copy; 2026 我的创意博客 | 设计与开发由我完成</p>
    </footer>

</body>
</html>
